<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Client Answers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: same tokens as index.html; one 1152px column with a login card, then a searchable list of client rows. */
:root {
  --bg: #fbfaf8;
  --surface: #ffffff;
  --ink: #1c1b1a;
  --muted: #6b6762;
  --line: #e4e0da;
  --accent: #c2452d;
  --ok: #2f7a4f;
  --font-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151413; --surface: #1d1c1a; --ink: #f1eee9; --muted: #a39e97;
    --line: #34312d; --accent: #e8735a; --ok: #5fb383; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151413; --surface: #1d1c1a; --ink: #f1eee9; --muted: #a39e97;
  --line: #34312d; --accent: #e8735a; --ok: #5fb383; color-scheme: dark;
}

* { box-sizing: border-box; }
/* Elements toggled with the hidden attribute must stay hidden even when a class sets display. */
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.topbar { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.topbar-inner, .page {
  max-width: 1152px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar-inner { padding-block: 12px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.topbar strong { font-weight: 600; }
.topbar-actions { display: flex; gap: 8px; align-items: center; }
.page { padding-block: 48px 96px; display: grid; gap: 32px; }
.stack { display: grid; gap: 24px; }

h1 { margin: 0; font-size: clamp(28px, 5vw, 40px); font-weight: 700; line-height: 1.1; letter-spacing: -.02em; }
.lead { margin: 0; color: var(--muted); max-width: 60ch; }

.btn {
  min-height: 44px; padding: 0 20px; border-radius: 8px; cursor: pointer; font-weight: 600;
  border: 1px solid var(--line); background: var(--surface);
  transition: transform .15s, border-color .2s;
}
.btn:hover { border-color: var(--ink); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #ffffff; }
.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); padding: 0 12px; }
.btn.quiet:hover { color: var(--ink); }
.btn.danger { color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

input[type="text"], input[type="email"], input[type="password"], input[type="search"] {
  width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
  padding: 12px; transition: border-color .2s;
}
input:focus { border-color: var(--ink); outline: none; }
.field { display: grid; gap: 4px; }
.field label { font-size: 13px; color: var(--muted); }
.status { font-size: 13px; min-height: 20px; margin: 0; }
.status.err { color: var(--accent); }
.status.ok { color: var(--ok); }

/* ---------- Login ---------- */
.login {
  max-width: 400px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 32px 24px; display: grid; gap: 16px;
}
.login h1 { font-size: 28px; }

/* ---------- List ---------- */
.list-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.list-head .count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.search { max-width: 360px; width: 100%; }
.clients { display: grid; gap: 8px; }
.client { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.client[open] { border-color: var(--ink); }
.client summary {
  list-style: none; cursor: pointer; padding: 16px;
  display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 2fr) auto auto; gap: 16px; align-items: center;
}
.client summary::-webkit-details-marker { display: none; }
.client summary:hover { background: var(--bg); }
.who { min-width: 0; }
.who b { display: block; font-weight: 600; overflow-wrap: anywhere; }
.who span, .when, .done { font-size: 13px; color: var(--muted); }
.mail { min-width: 0; overflow-wrap: anywhere; }
.when { font-variant-numeric: tabular-nums; white-space: nowrap; }
.chev { width: 16px; height: 16px; stroke: var(--muted); transition: transform .25s var(--ease); }
.client[open] .chev { transform: rotate(180deg); }

.detail { border-top: 1px solid var(--line); padding: 24px 16px; display: grid; gap: 32px; animation: rise .4s var(--ease) both; }
.detail h3 { margin: 0 0 12px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
.pick { display: grid; gap: 8px; min-width: 0; }
.pick img { width: 100%; height: auto; max-width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: top; border-radius: 8px; border: 1px solid var(--line); background: var(--line); }
.pick .noimg { aspect-ratio: 16 / 10; border-radius: 8px; border: 1px dashed var(--line); display: grid; place-items: center; font-size: 13px; color: var(--muted); }
.pick dt { font-size: 13px; color: var(--muted); }
.pick dd { margin: 0; font-weight: 600; }
.yn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px 24px; margin: 0; }
.yn-grid div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.yn-grid dt { color: var(--muted); }
.yn-grid dd { margin: 0; font-weight: 600; }
.text-list { display: grid; gap: 16px; margin: 0; }
.text-list dt { font-size: 13px; color: var(--muted); }
.text-list dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 75ch; }
.text-list dd.empty, .yn-grid dd.empty, .pick dd.empty { color: var(--muted); font-weight: 400; }
.detail-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; font-size: 13px; }

.empty-note { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 32px 24px; color: var(--muted); margin: 0; }

.rise { animation: rise .5s var(--ease) both; }
@keyframes rise { from { opacity: .001; transform: translateY(8px); } to { opacity: 1; transform: none; } }

@media (max-width: 720px) {
  .client summary { grid-template-columns: minmax(0, 1fr) auto; }
  .mail, .done { display: none; }
  .page { padding-block: 32px 64px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <strong>Client answers</strong>
    <div class="topbar-actions" id="topbar-actions" hidden>
      <button type="button" class="btn" id="refresh-btn">Refresh</button>
      <button type="button" class="btn quiet" id="logout-btn">Log out</button>
    </div>
  </div>
</div>

<main class="page">
  <form class="login rise" id="login-form" novalidate>
    <h1>Log in</h1>
    <p class="lead">Only admins can see client answers.</p>
    <div class="field">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn primary" id="login-btn">Log in</button>
    <p class="status" id="login-status" role="status"></p>
  </form>

  <section id="list-view" hidden>
    <div class="stack">
      <div class="list-head">
        <div>
          <h1>All clients</h1>
          <span class="count" id="count">Loading…</span>
        </div>
        <input type="search" class="search" id="search" placeholder="Search by name or email" aria-label="Search by name or email">
      </div>
      <p class="status" id="list-status" role="status"></p>
      <div class="clients" id="clients"></div>
    </div>
  </section>
</main>

<script src="questions.js"></script>
<script src="config.js"></script>
<script>
/**
 * @typedef {{access_token: string, refresh_token: string, expires_at: number}} Session
 * @typedef {{id: string, created_at: string, client_name: string, client_email: string,
 *            picks: Record<string, string>, yesno: Record<string, string>, answers: Record<string, string>}} Submission
 */

const SESSION_KEY = "questionnaire-admin-session";
const CHEVRON_SVG = '<svg class="chev" viewBox="0 0 16 16" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>';

class SessionExpiredError extends Error {}

/** @type {Submission[]} */
let submissions = [];

function el(/** @type {string} */ id) {
  const found = document.getElementById(id);
  if (!found) throw new Error(`Missing element #${id} in admin.html`);
  return found;
}

function escapeHtml(/** @type {string} */ s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c] ?? c);
}

function setStatus(/** @type {string} */ id, /** @type {string} */ msg, /** @type {"ok" | "err" | ""} */ kind) {
  const s = el(id);
  s.textContent = msg;
  s.className = `status ${kind}`;
}

/* ---------- Session storage (closes with the tab) ---------- */

/** @returns {Session | null} */
function loadSession() {
  const raw = sessionStorage.getItem(SESSION_KEY);
  return raw ? /** @type {Session} */ (JSON.parse(raw)) : null;
}

function saveSession(/** @type {Session} */ session) {
  sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
}

function clearSession() {
  sessionStorage.removeItem(SESSION_KEY);
}

/* ---------- Supabase Auth ---------- */

/** Exchanges credentials or a refresh token for a session. */
async function requestToken(/** @type {"password" | "refresh_token"} */ grant, /** @type {Record<string, string>} */ body) {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=${grant}`, {
    method: "POST",
    headers: { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) {
    const reason = data.error_description || data.msg || data.message || JSON.stringify(data);
    throw new Error(`Login failed (status ${res.status}): ${reason}`);
  }
  /** @type {Session} */
  const session = { access_token: data.access_token, refresh_token: data.refresh_token, expires_at: data.expires_at };
  saveSession(session);
  return session;
}

/** Returns a usable access token, refreshing it when it is about to expire. */
async function accessToken() {
  const session = loadSession();
  if (!session) throw new SessionExpiredError("Not logged in.");
  if (session.expires_at * 1000 - 60000 > Date.now()) return session.access_token;
  try {
    return (await requestToken("refresh_token", { refresh_token: session.refresh_token })).access_token;
  } catch (e) {
    clearSession();
    throw new SessionExpiredError("Your login has expired. Please log in again.");
  }
}

/* ---------- Submissions API ---------- */

async function authHeaders() {
  return { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${await accessToken()}` };
}

/** @returns {Promise<Submission[]>} */
async function fetchSubmissions() {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/submissions?select=*&order=created_at.desc`, { headers: await authHeaders() });
  if (res.status === 401) { clearSession(); throw new SessionExpiredError("Your login has expired. Please log in again."); }
  if (!res.ok) throw new Error(`Could not load answers (status ${res.status}): ${await res.text()}`);
  return /** @type {Submission[]} */ (await res.json());
}

async function deleteSubmission(/** @type {string} */ id) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/submissions?id=eq.${encodeURIComponent(id)}`, {
    method: "DELETE",
    headers: { ...(await authHeaders()), Prefer: "return=representation" },
  });
  if (!res.ok) throw new Error(`Could not delete (status ${res.status}): ${await res.text()}`);
  const deleted = /** @type {Submission[]} */ (await res.json());
  if (deleted.length !== 1) throw new Error(`Delete was not allowed for this account (rows deleted: ${deleted.length}).`);
}

/* ---------- Rendering ---------- */

function formatDate(/** @type {string} */ iso) {
  return new Date(iso).toLocaleString(undefined, { day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit" });
}

function pickedImage(/** @type {string} */ questionId, /** @type {string} */ value) {
  const q = STYLE_QUESTIONS.find((s) => s.id === questionId);
  const opt = q ? q.options.find((o) => o.value === value) : undefined;
  return opt ? opt.image : null;
}

function picksHtml(/** @type {Submission} */ s) {
  return STYLE_QUESTIONS.map((q) => {
    const value = s.picks[q.id] ?? "";
    const img = value ? pickedImage(q.id, value) : null;
    const art = img
      ? `<img src="${escapeHtml(img)}" alt="${escapeHtml(value)}" loading="lazy">`
      : `<div class="noimg">Not picked</div>`;
    return `<div class="pick">${art}<dl style="margin:0"><dt>${escapeHtml(q.title)}</dt><dd class="${value ? "" : "empty"}">${escapeHtml(value || "Not picked")}</dd></dl></div>`;
  }).join("");
}

function yesNoHtml(/** @type {Submission} */ s) {
  return YES_NO_QUESTIONS.map((q) => {
    const v = s.yesno[q.id] ?? "";
    return `<div title="${escapeHtml(q.text)}"><dt>${escapeHtml(q.label)}</dt><dd class="${v ? "" : "empty"}">${escapeHtml(v || "-")}</dd></div>`;
  }).join("");
}

function textHtml(/** @type {Submission} */ s) {
  return TEXT_QUESTIONS.map((q) => {
    const v = (s.answers[q.id] ?? "").trim();
    return `<div><dt>${escapeHtml(q.text)}</dt><dd class="${v ? "" : "empty"}">${escapeHtml(v || "No answer")}</dd></div>`;
  }).join("");
}

function clientHtml(/** @type {Submission} */ s) {
  const picked = STYLE_QUESTIONS.filter((q) => s.picks[q.id]).length;
  return `<details class="client" data-id="${escapeHtml(s.id)}">
    <summary>
      <span class="who"><b>${escapeHtml(s.client_name)}</b><span>${formatDate(s.created_at)}</span></span>
      <span class="mail">${escapeHtml(s.client_email)}</span>
      <span class="done">${picked} of ${STYLE_QUESTIONS.length} pictures picked</span>
      ${CHEVRON_SVG}
    </summary>
    <div class="detail">
      <section><h3>Picture choices</h3><div class="pick-grid">${picksHtml(s)}</div></section>
      <section><h3>About the website</h3><dl class="yn-grid">${yesNoHtml(s)}</dl></section>
      <section><h3>About the restaurant</h3><dl class="text-list">${textHtml(s)}</dl></section>
      <div class="detail-actions" data-actions="${escapeHtml(s.id)}">
        <button type="button" class="btn quiet danger" data-delete="${escapeHtml(s.id)}">Delete</button>
      </div>
    </div>
  </details>`;
}

function renderList() {
  const term = /** @type {HTMLInputElement} */ (el("search")).value.trim().toLowerCase();
  const shown = submissions.filter((s) => !term
    || s.client_name.toLowerCase().includes(term) || s.client_email.toLowerCase().includes(term));
  el("count").textContent = term
    ? `${shown.length} of ${submissions.length} clients match`
    : `${submissions.length} ${submissions.length === 1 ? "client" : "clients"}`;
  if (submissions.length === 0) {
    el("clients").innerHTML = `<p class="empty-note">No answers yet. When a client presses Submit on the questionnaire, they show up here.
      If clients have already submitted, check that your login email is listed in the admins table in Supabase.</p>`;
    return;
  }
  el("clients").innerHTML = shown.length
    ? shown.map(clientHtml).join("")
    : `<p class="empty-note">No client matches "${escapeHtml(term)}".</p>`;
}

/* ---------- Views ---------- */

function showLogin(/** @type {string} */ message) {
  el("login-form").hidden = false;
  el("list-view").hidden = true;
  el("topbar-actions").hidden = true;
  setStatus("login-status", message, message ? "err" : "");
}

async function showList() {
  el("login-form").hidden = true;
  el("list-view").hidden = false;
  el("topbar-actions").hidden = false;
  await loadList();
}

async function loadList() {
  setStatus("list-status", "", "");
  el("count").textContent = "Loading…";
  try {
    submissions = await fetchSubmissions();
    renderList();
  } catch (e) {
    if (e instanceof SessionExpiredError) { showLogin(e.message); return; }
    const err = /** @type {Error} */ (e);
    el("count").textContent = "";
    setStatus("list-status", err instanceof TypeError ? "Could not reach the database. Check your internet connection and press Refresh." : err.message, "err");
  }
}

/* ---------- Actions ---------- */

async function handleLogin(/** @type {SubmitEvent} */ ev) {
  ev.preventDefault();
  const email = /** @type {HTMLInputElement} */ (el("login-email")).value.trim();
  const password = /** @type {HTMLInputElement} */ (el("login-password")).value;
  if (!email || !password) { setStatus("login-status", "Type your email and password.", "err"); return; }
  const btn = /** @type {HTMLButtonElement} */ (el("login-btn"));
  btn.disabled = true;
  setStatus("login-status", "Logging in…", "");
  try {
    await requestToken("password", { email, password });
    /** @type {HTMLInputElement} */ (el("login-password")).value = "";
    await showList();
  } catch (e) {
    const err = /** @type {Error} */ (e);
    setStatus("login-status", err instanceof TypeError ? "Could not reach the database. Check your internet connection." : err.message, "err");
  } finally {
    btn.disabled = false;
  }
}

async function handleLogout() {
  const session = loadSession();
  clearSession();
  showLogin("");
  if (session) {
    await fetch(`${SUPABASE_URL}/auth/v1/logout`, {
      method: "POST",
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${session.access_token}` },
    });
  }
}

function askDelete(/** @type {string} */ id) {
  const s = submissions.find((x) => x.id === id);
  const area = /** @type {HTMLElement} */ (document.querySelector(`[data-actions="${CSS.escape(id)}"]`));
  area.innerHTML = `<span>Delete ${escapeHtml(s ? s.client_name : "this client")}'s answers for good?</span>
    <button type="button" class="btn quiet" data-keep="${escapeHtml(id)}">Keep</button>
    <button type="button" class="btn danger" data-confirm-delete="${escapeHtml(id)}">Yes, delete</button>`;
}

function cancelDelete(/** @type {string} */ id) {
  const area = /** @type {HTMLElement} */ (document.querySelector(`[data-actions="${CSS.escape(id)}"]`));
  area.innerHTML = `<button type="button" class="btn quiet danger" data-delete="${escapeHtml(id)}">Delete</button>`;
}

async function confirmDelete(/** @type {string} */ id) {
  try {
    await deleteSubmission(id);
    submissions = submissions.filter((s) => s.id !== id);
    renderList();
    setStatus("list-status", "Deleted.", "ok");
  } catch (e) {
    if (e instanceof SessionExpiredError) { showLogin(e.message); return; }
    setStatus("list-status", /** @type {Error} */ (e).message, "err");
    cancelDelete(id);
  }
}

function bindEvents() {
  el("login-form").addEventListener("submit", handleLogin);
  el("logout-btn").addEventListener("click", handleLogout);
  el("refresh-btn").addEventListener("click", loadList);
  el("search").addEventListener("input", renderList);
  el("clients").addEventListener("click", (ev) => {
    const t = /** @type {HTMLElement} */ (ev.target);
    if (t.dataset.delete) askDelete(t.dataset.delete);
    else if (t.dataset.keep) cancelDelete(t.dataset.keep);
    else if (t.dataset.confirmDelete) confirmDelete(t.dataset.confirmDelete);
  });
}

function start() {
  bindEvents();
  try {
    assertDatabaseConfigured();
  } catch (e) {
    if (!(e instanceof DatabaseNotConfiguredError)) throw e;
    showLogin(e.message);
    /** @type {HTMLButtonElement} */ (el("login-btn")).disabled = true;
    return;
  }
  if (loadSession()) showList();
  else showLogin("");
}

start();
</script>
</body>
</html>
